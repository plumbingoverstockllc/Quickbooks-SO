name: Build Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m pip install --force-reinstall --no-binary charset-normalizer charset-normalizer

      - name: Build DMQuotes.exe
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "DMQuotes" --icon "DMQuotes.ico" --splash "splash.png" --collect-all numpy --collect-all pandas --collect-all openpyxl --collect-all xlrd --collect-all pdfplumber --collect-all pdfminer --collect-all cryptography --collect-all cffi --collect-all charset_normalizer --add-data "Logo_New.png;." --add-data "Shimira_Labs.png;." --add-data "DMQuotes.ico;." --add-data "vendor_pricing.json;." app.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
          if (-not (Test-Path "dist\QB-Sales-Order-Converter-Setup.exe")) {
            throw "Setup.exe was not created"
          }

      - name: Hash installer
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\QB-Sales-Order-Converter-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          echo "sha256=$hash" >> $env:GITHUB_OUTPUT
          Set-Content -Path dist\SHA256.txt -Value $hash -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: QB-Sales-Order-Converter-Setup
          path: |
            dist/QB-Sales-Order-Converter-Setup.exe
            dist/SHA256.txt

      - name: Publish GitHub Release and update feed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $sha = "${{ steps.hash.outputs.sha256 }}"
          # A 'b' suffix (v1.072b) marks a test build. Betas are published as
          # GitHub prereleases and only ever touch releases/beta.json, so an
          # installed stable copy is never offered them by its startup check.
          $isBeta = $ver.ToLower().EndsWith('b')
          $asset = "dist/QB-Sales-Order-Converter-Setup.exe#QB-Sales-Order-Converter-Setup.exe"
          $url = "https://github.com/plumbingoverstockllc/Quickbooks-SO/releases/download/$tag/QB-Sales-Order-Converter-Setup.exe"

          if ($isBeta) {
            $summary = "Uploads stop when the customer is not in QuickBooks instead of creating one; vendor pickers list each QuickBooks vendor once; dialogs say Estimate when you are building an estimate."
            $body = @(
              "Beta v$ver — test build. Install it from Help -> Check for Beta Update.",
              "",
              "- An upload whose customer is not in the QuickBooks Customer list now stops and says so, instead of creating the customer. This prevents near-duplicate customer records from typos and spelling differences.",
              "- Vendor pickers list each QuickBooks vendor once, under its list name. The vendor's Company Name is no longer offered as a second, near-identical choice.",
              "- The upload window, the row editor and the missing-field warning now say Estimate when the document type is Estimate, instead of always saying SO / Sales Order.",
              "",
              "SHA256: $sha"
            ) -join "`n"
            gh release create $tag $asset --title "DMQuotes v$ver (beta)" --notes $body --prerelease
            $feedPath = "releases/beta.json"
          } else {
            $summary = "Setup clears inherited PyInstaller environment variables so the post-update relaunch no longer hits the bootloader security check."
            $body = @(
              "v$ver for every installed copy of DMQuotes.",
              "",
              "- Setup now clears the PyInstaller variables it inherits from the running app, so the relaunch after an update no longer fails with ""Security validation failure: parent process has different executable!""",
              "- This makes upgrades work from any older build, including ones whose own updater does not clean up after itself",
              "",
              "SHA256: $sha"
            ) -join "`n"
            gh release create $tag $asset --title "DMQuotes v$ver" --notes $body
            $feedPath = "releases/latest.json"
          }

          $feed = @{
            version = $ver
            url = $url
            sha256 = $sha
            notes = $summary
          } | ConvertTo-Json
          Set-Content -Path $feedPath -Value $feed -Encoding utf8
          if (-not $isBeta) {
            # Point the beta channel at the new stable so a superseded beta is
            # never re-offered to someone who moved to stable.
            Copy-Item releases/latest.json releases/beta.json -Force
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/latest.json releases/beta.json
          git commit -m "Update release feed for $tag"
          git pull --rebase origin ${{ github.event.repository.default_branch }}
          git push origin HEAD:${{ github.event.repository.default_branch }}
